{
  "version": "2",
  "linters": {
    "enable": [
      "gocritic",
      "gosec",
      "misspell",
      "nakedret",
      "unconvert",
      "unparam"
    ],
    "disable": [
      "depguard",
      "dupl",
      "gocyclo",
      "lll",
      "prealloc"
    ],
    "settings": {
      "gocritic": {
        "enabled-checks": [
          "commentedOutCode"
        ]
      },
      "gosec": {
        "excludes": [
          "G115"
        ]
      }
    },
    "exclusions": {
      "presets": [
        "comments",
        "common-false-positives",
        "std-error-handling",
        "legacy"
      ]
    }
  },
  "formatters": {
    "enable": [
      "gofmt",
      "goimports"
    ]
  }
}
